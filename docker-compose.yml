services:
  monitor:
    build: .
    env_file:
      - .env
    volumes:
      # Banco SQLite persistente (estado processado + prazos manuais)
      - ./data:/app/data
      # Descomente para Google Calendar (coloque os arquivos na raiz do projeto):
      # - ./credentials.json:/app/credentials.json:ro
      # - ./token.json:/app/token.json
    restart: unless-stopped
    command: python -m src.scheduler
